service: timebrew-frontend

provider:
  name: aws
  region: us-east-1
  stage: prod

custom:
  domainName: timebrew.news
  # S3 bucket names are globally unique; suffix with the account id to avoid
  # collisions with the bucket the old account still owns.
  bucketName: timebrew-web-prod-891772298575

resources:
  Resources:
    # =========================================================================
    # Route53 hosted zone for timebrew.news (NS must be set at the registrar)
    # =========================================================================
    HostedZone:
      Type: AWS::Route53::HostedZone
      Properties:
        Name: ${self:custom.domainName}

    # =========================================================================
    # ACM certificate (DNS-validated automatically against the hosted zone).
    # NOTE: validation only completes once the registrar nameservers point at
    # this hosted zone, so the stack waits here on first deploy.
    # =========================================================================
    Certificate:
      Type: AWS::CertificateManager::Certificate
      Properties:
        DomainName: ${self:custom.domainName}
        SubjectAlternativeNames:
          - www.${self:custom.domainName}
        ValidationMethod: DNS
        DomainValidationOptions:
          - DomainName: ${self:custom.domainName}
            HostedZoneId: !Ref HostedZone
          - DomainName: www.${self:custom.domainName}
            HostedZoneId: !Ref HostedZone

    # S3 Bucket for hosting (private, accessed via CloudFront only)
    WebsiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    # Origin Access Control for CloudFront
    OriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: "timebrew-s3-oac"
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    # CloudFront Distribution
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: !GetAtt WebsiteBucket.RegionalDomainName
              Id: S3Origin
              S3OriginConfig:
                OriginAccessIdentity: ""
              OriginAccessControlId: !Ref OriginAccessControl
          DefaultCacheBehavior:
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          Enabled: true
          DefaultRootObject: index.html
          Aliases:
            - ${self:custom.domainName}
            - www.${self:custom.domainName}
          ViewerCertificate:
            AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html

    # S3 Bucket Policy for CloudFront OAC access
    WebsiteBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebsiteBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${WebsiteBucket}/*"
              Condition:
                StringEquals:
                  "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

    # Route53 alias records -> CloudFront
    ApexDNSRecord:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: !Ref HostedZone
        Name: ${self:custom.domainName}
        Type: A
        AliasTarget:
          DNSName: !GetAtt CloudFrontDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2

    WwwDNSRecord:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: !Ref HostedZone
        Name: www.${self:custom.domainName}
        Type: A
        AliasTarget:
          DNSName: !GetAtt CloudFrontDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2

    # =========================================================================
    # Email authentication for SES-sent mail (Cognito OTP / verification, daily
    # briefings). DKIM CNAMEs are managed out-of-band by SES. These add SPF and
    # DMARC so mail from no-reply@timebrew.news lands in the inbox, not spam.
    # =========================================================================
    SpfRecord:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: !Ref HostedZone
        Name: ${self:custom.domainName}
        Type: TXT
        TTL: "300"
        ResourceRecords:
          - '"v=spf1 include:amazonses.com ~all"'

    DmarcRecord:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: !Ref HostedZone
        Name: _dmarc.${self:custom.domainName}
        Type: TXT
        TTL: "300"
        ResourceRecords:
          - '"v=DMARC1; p=none; rua=mailto:dhirajc963@gmail.com;"'

  Outputs:
    HostedZoneNameServers:
      Description: "Set these as the nameservers for timebrew.news at your registrar"
      Value: !Join [", ", !GetAtt HostedZone.NameServers]

    WebsiteBucketName:
      Value: !Ref WebsiteBucket
      Description: "S3 Bucket for website hosting"

    CloudFrontDistributionId:
      Value: !Ref CloudFrontDistribution
      Description: "CloudFront Distribution ID"

    CloudFrontDomainName:
      Value: !GetAtt CloudFrontDistribution.DomainName
      Description: "CloudFront Domain Name"

    WebsiteURL:
      Value: "https://timebrew.news"
      Description: "Website URL"
